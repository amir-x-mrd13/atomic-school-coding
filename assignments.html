<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارسال کد تکلیف | مدرسه انرژی اتمی</title><link rel="stylesheet" href="./asesst/styles/reset.css"><link rel="stylesheet" href="./asesst/styles/styles.css"><style>body{background:#08111f;color:#eef6ff;min-height:100vh;padding:20px;font-family:inherit}.wrap{max-width:900px;margin:24px auto}.card{background:#121f34;border:1px solid #29415f;border-radius:16px;padding:clamp(18px,4vw,30px);margin:16px 0}h1{font-size:clamp(25px,5vw,34px)}p{color:#c2d5eb;line-height:1.9}label{display:block;margin:14px 0 6px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #34516f;border-radius:10px;background:#071523;color:#fff;font:inherit}textarea{min-height:220px;resize:vertical;font-family:monospace;direction:ltr;text-align:left}button,.link{display:inline-block;border:0;border-radius:9px;padding:11px 16px;background:#1267b3;color:white;font:inherit;text-decoration:none;cursor:pointer;margin:8px 4px 0 0}.muted{font-size:13px;color:#91abc7}.status{white-space:pre-wrap;line-height:1.8}</style></head><body><main class="wrap"><a class="link" href="./index.html">← بازگشت</a><h1>📨 ارسال کد تکلیف</h1><p>کدت را در VS Code بنویس و اینجا فقط کد را ارسال کن؛ نیازی به آپلود فایل نیست.</p><section class="card"><form id="form"><label for="studentName">نام دانش‌آموز</label><input id="studentName" maxlength="100" required placeholder="نام و نام خانوادگی"><label for="category">دسته‌بندی تکلیف</label><select id="category" required><option value="">در حال دریافت دسته‌بندی‌ها...</option></select><label for="assignmentTitle">عنوان / شماره تکلیف</label><input id="assignmentTitle" maxlength="150" required placeholder="مثلاً تکلیف ۱ - چت‌بات"><label for="code">کد برنامه</label><textarea id="code" required spellcheck="false" placeholder="# کد خود را از VS Code اینجا بچسبانید"></textarea><button id="submit" type="submit">ارسال کد</button><p id="status" class="status" role="status"></p></form></section><section class="card"><h2>کدهای منتشرشده توسط استاد</h2><div id="teacherCodes">برای دیدن کدهای استاد، اتصال Firebase باید تنظیم شده باشد.</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,collection,addDoc,getDocs,query,orderBy,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const name=document.getElementById('studentName'),category=document.getElementById('category'),status=document.getElementById('status'),form=document.getElementById('form');name.value=sessionStorage.getItem('atomicStudentName')||'';async function load(){try{const snap=await getDocs(query(collection(db,'assignmentCategories'),orderBy('name')));category.innerHTML='<option value="">یک دسته‌بندی انتخاب کنید</option>';snap.forEach(d=>{const o=document.createElement('option');o.value=d.data().name;o.textContent=d.data().name;category.append(o)});if(snap.empty)category.innerHTML='<option value="عمومی">عمومی (تا زمان تعریف دسته‌بندی توسط استاد)</option>';const codes=await getDocs(query(collection(db,'teacherCodes'),orderBy('createdAt','desc')));const box=document.getElementById('teacherCodes');box.replaceChildren();codes.forEach(d=>{const a=document.createElement('article');a.className='card';const h=document.createElement('h3');h.textContent=d.data().title||'کد استاد';const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left';pre.textContent=d.data().code||'';a.append(h,pre);box.append(a)});if(codes.empty)box.textContent='هنوز کدی منتشر نشده است.'}catch(e){category.innerHTML='<option value="عمومی">عمومی</option>';document.getElementById('teacherCodes').textContent='برای بارگذاری دسته‌بندی‌ها و کدهای استاد، Firebase و قوانین دسترسی باید تنظیم شوند.'}}load();form.addEventListener('submit',async e=>{e.preventDefault();const n=name.value.trim(),c=category.value, t=document.getElementById('assignmentTitle').value.trim(),code=document.getElementById('code').value.trim();if(!n||!c||!t||!code){status.textContent='همهٔ کادرها را کامل کن.';return}const btn=document.getElementById('submit');btn.disabled=true;status.textContent='در حال ارسال...';try{const user=(await signInAnonymously(auth)).user;await addDoc(collection(db,'submissions'),{studentName:n,assignmentTitle:t,category:c,answerText:code,ownerUid:user.uid,status:'new',approved:false,createdAt:serverTimestamp()});sessionStorage.setItem('atomicStudentName',n);form.reset();name.value=n;status.textContent='کد ارسال شد.'}catch(err){status.textContent='ارسال انجام نشد. Firebase یا قوانین Firestore تنظیم نیستند ('+(err.code||'خطا')+').' }finally{btn.disabled=false}});</script></body></html>
